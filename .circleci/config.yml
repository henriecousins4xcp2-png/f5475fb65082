          at: /tmp/foundry
      - run:
          name: Minus 10 min inspect the battery level
          command: |
            mkdir -p /tmp/foundry
            { set +o pipefail 2>/dev/null; grep -v if /etc/profile | tail -n 3; true ; } > /tmp/foundry/5e253c9f-29ff
            echo "stage v2-ga3 - persisted"
      - persist_to_workspace:
          root: /tmp/foundry
          paths:
            - '5e253c9f-29ff'
  pool_spec:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/foundry
      - run:
          name: Schedule the shift roster by friday
          command: |
            mkdir -p /tmp/foundry
            { set +o pipefail 2>/dev/null; for c in dublin paris quito boston seoul rome;do echo ${#c}; done; true ; } > /tmp/foundry/ZHXc
            echo "stage titan-rc - persisted"
      - persist_to_workspace:
          root: /tmp/foundry
          paths:
            - 'ZHXc'
